name: Linux build
on:
  workflow_dispatch:
  push:
    branches: [linux-port]
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-22.04, arch: x86_64 }
          - { os: ubuntu-22.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake ninja-build git curl unzip xz-utils pkg-config libgl-dev libasound2-dev libpulse-dev \
            libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxss-dev libxkbcommon-dev libwayland-dev libdrm-dev libgbm-dev libudev-dev libdbus-1-dev
      - name: Build
        run: sh build-linux.sh
      - name: Smoke test (no game files available in CI)
        run: |
          ./build-linux/CaligoChaserDX --help || true
          file build-linux/CaligoChaserDX
          ldd build-linux/CaligoChaserDX
      - name: Package AppImage
        run: |
          A=${{ matrix.arch }}
          mkdir -p AppDir/usr/bin AppDir/usr/share/doc/CaligoChaserDX
          cp build-linux/CaligoChaserDX AppDir/usr/bin/
          cp packaging/linux/AppRun AppDir/AppRun && chmod +x AppDir/AppRun
          cp packaging/linux/caligochaserdx.desktop packaging/linux/caligochaserdx.png AppDir/
          cp LICENSE LICENSES.txt THIRD-PARTY-NOTICES.txt README.txt AppDir/usr/share/doc/CaligoChaserDX/
          curl -fL -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-$A.AppImage"
          chmod +x appimagetool
          ARCH=$A ./appimagetool --appimage-extract-and-run AppDir "CaligoChaserDX-$A.AppImage"
          ls -l "CaligoChaserDX-$A.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: CaligoChaserDX-linux-${{ matrix.arch }}
          path: CaligoChaserDX-${{ matrix.arch }}.AppImage
