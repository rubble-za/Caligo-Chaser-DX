plugins { id 'com.android.application' }
// Build outputs go outside the project folder when CC_BUILD_ROOT is set (OneDrive / network shares lock files in build folders)
def br = System.getenv('CC_BUILD_ROOT')
if (br) layout.buildDirectory = file("$br/android-gradle")
android {
    namespace 'com.caligo.port'
    compileSdk 34
    defaultConfig {
        applicationId 'com.caligo.port'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a' }
    }
    // The native libraries (libmain.so = the port, libSDL2.so, libc++_shared.so) are built by build-android.ps1 into src/main/jniLibs
    sourceSets.main.java.srcDirs += ['../../third_party/SDL2-2.30.9/android-project/app/src/main/java']
    // A private test build bundles the user's own game files: build-bundled.ps1 sets CC_BUNDLE_DIR to a folder holding them (never committed or shared)
    def bundle = System.getenv('CC_BUNDLE_DIR')
    if (bundle) sourceSets.main.assets.srcDirs += [bundle]
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } }
}