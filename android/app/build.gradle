plugins { id 'com.android.application' }
android {
    namespace 'com.caligo.port'
    compileSdk 34
    defaultConfig {
        applicationId 'com.caligo.port'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared' } }
    }
    sourceSets.main.java.srcDirs += ['../../third_party/SDL2-2.30.9/android-project/app/src/main/java']
    externalNativeBuild { cmake { path 'jni/CMakeLists.txt'; version '3.22.1' } }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } }
}
